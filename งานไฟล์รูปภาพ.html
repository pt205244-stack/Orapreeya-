<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <style>
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 800px;
            margin: auto;
        }
        img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            border: 2px solid #ddd;
        }
    </style>
</head>
<body>

    <div class="gallery">
        <!-- PNG 3 รูป -->
        <img src="images.png" alt="PNG 1">
        <img src="images (1).png" alt="PNG 2">
        <img src="images (2).png" alt="PNG 3">

        <!-- JPG 3 รูป -->
        <img src="5f57f2ca-8fc6-413a-9a16-2b15e725012b.jpg" alt="JPG 1">
        <img src="32f9acf0-bb0b-11eb-8220-9f8ed436e416_original.jpg" alt="JPG 2">
        <img src="images.jpg" alt="JPG 3">

        <!-- GPF 3 รูป (สมมติว่าเป็นรูปภาพ) -->
        <img src="200w.gif" alt="GIF 1">
        <img src="2036-220520153111lv-14.gif" alt="GIF 2">
        <img src="anya-forger-spy-x-family.gif" alt="GIF 3">
    </div>

</body>
</html>
